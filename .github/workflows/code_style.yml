name: Code Style
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: code-style-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch the real OS keychain (macOS Keychain auth dialog /
  # Linux Secret Service). Guarded by src/secrets/keychain.rs::os_keychain_suppressed:
  # cfg!(test) covers unit tests; this covers integration/e2e that link the
  # non-cfg(test) library.
  BRASSCLAW_DISABLE_OS_KEYCHAIN: "1"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.diff.outputs.has_code }}
      has_boundary_check: ${{ steps.diff.outputs.has_boundary_check }}
      has_reborn_cli: ${{ steps.diff.outputs.has_reborn_cli }}
      base_sha: ${{ steps.diff.outputs.base_sha }}
      head_sha: ${{ steps.diff.outputs.head_sha }}
      comparison: ${{ steps.diff.outputs.comparison }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_DELETED: ${{ github.event.deleted }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha) }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Push compares the actual endpoints; PR/merge queue keep merge-base semantics.
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_DELETED" == "true" || ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid push comparison endpoints" >&2
              exit 1
            fi
            git cat-file -e "$HEAD_SHA^{commit}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git hash-object -t tree --stdin < /dev/null)"
            else
              git cat-file -e "$BASE_SHA^{commit}"
            fi
            COMPARISON=endpoints
            CHANGED_FILES="$(git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          else
            COMPARISON=merge-base
            CHANGED_FILES="$(git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA"..."$HEAD_SHA" --)"
          fi
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "comparison=$COMPARISON"
          } >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(src/|crates/|tests/|migrations/|Cargo\.toml$|Cargo\.lock$|Dockerfile$|scripts/check_no_panics\.py$|scripts/check_gateway_boundaries\.py$|\.github/workflows/code_style\.yml$)'; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes — style checks will be skipped"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(scripts/check_gateway_boundaries\.py$|\.github/workflows/code_style\.yml$)'; then
            echo "has_boundary_check=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_boundary_check=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(crates/brassclaw_reborn/|crates/brassclaw_reborn_cli/|crates/brassclaw_reborn_config/|crates/brassclaw_architecture/tests/reborn_dependency_boundaries\.rs$|Cargo\.toml$|Cargo\.lock$|\.github/workflows/code_style\.yml$)'; then
            echo "has_reborn_cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reborn_cli=false" >> "$GITHUB_OUTPUT"
          fi

  clippy-matrix:
    name: Configure clippy matrix
    needs: changes
    if: needs.changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          FULL='[{"name":"all-features","flags":"--all-features"},{"name":"default","flags":""}]'
          SLIM='[{"name":"all-features","flags":"--all-features"}]'

          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "matrix=${SLIM}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=${FULL}" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  deny-check:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: [changes, clippy-matrix]
    if: needs.changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.clippy-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: clippy
          save-if: ${{ matrix.name == 'all-features' && github.event_name == 'workflow_dispatch' }}
      - name: Check lints
        run: cargo clippy --all --benches --tests --examples ${{ matrix.flags }} -- -D warnings

  clippy-windows:
    name: Clippy Windows (${{ matrix.name }})
    needs: [changes, clippy-matrix]
    if: needs.changes.outputs.has_code == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.clippy-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: windows-${{ matrix.name }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Check lints
        run: cargo clippy --all --benches --tests --examples ${{ matrix.flags }} -- -D warnings

  reborn-cli-smoke:
    name: Reborn CLI smoke tests
    needs: changes
    if: needs.changes.outputs.has_reborn_cli == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install the native PostgreSQL runtime ABI
        run: sudo apt-get update && sudo apt-get install -y libxml2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: reborn-cli-smoke
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test Reborn boot config crate
        run: cargo test -p brassclaw_reborn_config
      - name: Build contained Monty worker
        run: cargo build -p brassclaw_monty_host --bin monty_worker --locked
      - name: Test Reborn CLI binary crate
        run: cargo test -p brassclaw_reborn_cli
      - name: Test Reborn architecture boundaries
        run: cargo test -p brassclaw_architecture reborn

  no-panics:
    name: No panics in production code
    needs: changes
    if: needs.changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check for .unwrap(), .expect(), assert!() in production code
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && needs.changes.outputs.head_sha || github.sha }}
          COMPARISON: ${{ needs.changes.outputs.comparison }}
        run: |
          python3 scripts/check_no_panics.py --self-test
          python3 scripts/check_no_panics.py --base "$BASE_SHA" --head "$HEAD_SHA" --comparison "$COMPARISON"

  gateway-boundaries:
    name: Gateway platform/feature boundaries
    needs: changes
    if: needs.changes.outputs.has_code == 'true' || needs.changes.outputs.has_boundary_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that platform/ has no back-edges into handlers/ or features/
        run: python3 scripts/check_gateway_boundaries.py
      - name: Self-test the boundary script
        run: python3 scripts/check_gateway_boundaries.py test

  code-style:
    name: Code Style (fmt + clippy)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - clippy-matrix
      - format
      - clippy
      - clippy-windows
      - deny-check
      - reborn-cli-smoke
      - no-panics
      - gateway-boundaries
    steps:
      - run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes failed: ${{ needs.changes.result }}" >&2
            exit 1
          fi
          for flag in \
            "${{ needs.changes.outputs.has_code }}" \
            "${{ needs.changes.outputs.has_boundary_check }}" \
            "${{ needs.changes.outputs.has_reborn_cli }}"; do
            if [[ "$flag" != "true" && "$flag" != "false" ]]; then
              echo "Missing or invalid scope output" >&2
              exit 1
            fi
          done
          if [[ "${{ needs.changes.outputs.has_code }}" == "false" ]]; then
            echo "No code changes — style checks skipped correctly"
            exit 0
          fi

          for job_result in \
            "clippy-matrix=${{ needs.clippy-matrix.result }}" \
            "no-panics=${{ needs.no-panics.result }}" \
            "format=${{ needs.format.result }}" \
            "clippy=${{ needs.clippy.result }}" \
            "deny-check=${{ needs.deny-check.result }}" \
            "gateway-boundaries=${{ needs.gateway-boundaries.result }}"; do
            name="${job_result%%=*}"
            result="${job_result##*=}"
            if [[ "$result" != "success" ]]; then
              echo "$name failed: $result"
              exit 1
            fi
          done

          if [[ "${{ needs.changes.outputs.has_reborn_cli }}" == "true" && "${{ needs.reborn-cli-smoke.result }}" != "success" ]]; then
            echo "Required Reborn CLI smoke check did not succeed" >&2
            exit 1
          fi

          for job_result in \
            "reborn-cli-smoke=${{ needs.reborn-cli-smoke.result }}" \
            "clippy-windows=${{ needs.clippy-windows.result }}"; do
            name="${job_result%%=*}"
            result="${job_result##*=}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "$name failed: $result"
              exit 1
            fi
          done
