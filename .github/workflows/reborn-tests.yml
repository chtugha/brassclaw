name: Tests (Reborn)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
      include_docker:
        description: Include Docker image build in this reusable test run
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
      include_docker:
        description: Include Docker image build in this run
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reborn-tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch the real OS keychain (macOS Keychain auth dialog /
  # Linux Secret Service). Guarded by src/secrets/keychain.rs::os_keychain_suppressed:
  # cfg!(test) covers unit tests; this covers integration/e2e that link the
  # non-cfg(test) library.
  BRASSCLAW_DISABLE_OS_KEYCHAIN: "1"

jobs:
  changes:
    name: Detect Reborn test scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.non_diff.outputs.docs_only || steps.diff.outputs.docs_only }}
      has_reborn_tests: ${{ steps.non_diff.outputs.has_reborn_tests || steps.diff.outputs.has_reborn_tests }}
      has_core_code: ${{ steps.non_diff.outputs.has_core_code || steps.diff.outputs.has_core_code }}
      has_runtime_heavy_risk: ${{ steps.non_diff.outputs.has_runtime_heavy_risk || steps.diff.outputs.has_runtime_heavy_risk }}
      has_engine_replay_risk: ${{ steps.non_diff.outputs.has_engine_replay_risk || steps.diff.outputs.has_engine_replay_risk }}
    steps:
      - id: non_diff
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "has_reborn_tests=true" >> "$GITHUB_OUTPUT"
          echo "has_core_code=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "has_runtime_heavy_risk=true" >> "$GITHUB_OUTPUT"
            echo "has_engine_replay_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_runtime_heavy_risk=false" >> "$GITHUB_OUTPUT"
            echo "has_engine_replay_risk=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"

          echo "Changed files:"
          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES"
          else
            echo "<none>"
          fi

          printf '%s\n' "$CHANGED_FILES" | scripts/ci/classify-test-scope.sh >> "$GITHUB_OUTPUT"

          has_match() {
            printf '%s\n' "$CHANGED_FILES" | grep -Eq "$1"
          }

          # Runtime-heavy risk: Reborn runtime/loop/capability/secrets/safety
          # crates, migrations, or shared build config. Modernized from the
          # v1 src/ path filters that the legacy "Tests (Legacy)" workflow used
          # (src/agent, src/channels/wasm, src/db, etc. — all removed in Phase 6).
          if has_match '^(crates/brassclaw_(reborn|reborn_composition|reborn_cli|reborn_config|agent_loop|threads|turns|capabilities|host_runtime|secrets|safety|hooks|hooks_postgres|process_sandbox|processes|dispatcher|network|runtime_policy|authorization|trust|approvals|run_state|loop_support|common|memory|events|event_projections|event_streams|reborn_event_store)/|migrations/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/reborn-tests\.yml$)'; then
            echo "has_runtime_heavy_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_runtime_heavy_risk=false" >> "$GITHUB_OUTPUT"
          fi

          # Engine replay risk: changes that could shift recorded trace/replay
          # snapshots. Modernized from the legacy workflow's filter (dropped the
          # v1 src/ paths and the deleted e2e_*_v2.rs / e2e_live.rs files).
          if has_match '^(crates/brassclaw_(common|engine|skills|safety|agent_loop|turns|threads|loop_support)/|tests/fixtures/llm_traces/|tests/snapshots/|tests/e2e_trace_.*\.rs$|tests/reborn_trace_.*\.rs$|tests/support/trace_llm\.rs$|Cargo\.toml$|Cargo\.lock$|build\.rs$|\.github/workflows/(replay-gate|reborn-tests)\.yml$)'; then
            echo "has_engine_replay_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_engine_replay_risk=false" >> "$GITHUB_OUTPUT"
          fi

  package-matrix:
    name: Discover Reborn package crates
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_reborn_tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - id: packages
        name: Build package matrix from Reborn crate families
        run: |
          packages="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -c '
                  [
                    .packages[]
                    | select(
                        (.name | startswith("brassclaw_reborn"))
                        or (.name | startswith("brassclaw_product"))
                        or (.name == "brassclaw_architecture")
                        or (.name == "brassclaw_slack_v2_adapter")
                        or (.name == "brassclaw_telegram_v2_adapter")
                        or (.name | startswith("brassclaw_webui_v2"))
                        or (.name == "brassclaw_memory")
                        or (.name == "brassclaw_secrets")
                      )
                    | .name
                  ]
                  | unique
                '
          )"

          if [ -z "${packages}" ] || [ "${packages}" = "[]" ]; then
            echo "No Reborn workspace crates discovered" >&2
            exit 1
          fi

          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Testing Reborn package crates:"
          printf '%s\n' "${packages}" | jq -r '.[] | "- " + .'

  matrix-config:
    name: Configure matrix
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_reborn_tests == 'true'
    outputs:
      windows_matrix: ${{ steps.set.outputs.windows_matrix }}
    steps:
      - id: set
        run: |
          # Windows build is a compile check across feature combinations.
          # PRs/merge queue use the slim matrix (all-features only); push and
          # workflow_call use the full matrix. Mirrors the legacy workflow.
          FULL='[{"name":"all-features","flags":"--no-default-features --features postgres,libsql,html-to-markdown,bedrock,import"},{"name":"default","flags":""}]'
          SLIM='[{"name":"all-features","flags":"--no-default-features --features postgres,libsql,html-to-markdown,bedrock,import"}]'

          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "windows_matrix=${SLIM}" >> "$GITHUB_OUTPUT"
          else
            echo "windows_matrix=${FULL}" >> "$GITHUB_OUTPUT"
          fi

  crate-tests:
    name: Test ${{ matrix.package }}
    needs: [changes, package-matrix]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_reborn_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.package-matrix.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-tests-${{ matrix.package }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run crate tests
        run: |
          feature_flags="$(scripts/ci/package-feature-flags.sh "${{ matrix.package }}")"

          # shellcheck disable=SC2086 # feature_flags intentionally expands to zero or more Cargo args.
          timeout --signal=INT --kill-after=30s 28m \
            cargo test -p "${{ matrix.package }}" ${feature_flags} --all-targets -- --nocapture

  root-reborn-parity-tests:
    name: Reborn root tests (${{ matrix.partition }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_reborn_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      REBORN_ROOT_TEST_PARTITIONS: 4
      REBORN_ROOT_TEST_PARTITION: ${{ matrix.partition }}
    strategy:
      fail-fast: true
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-tests-root-${{ matrix.partition }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Reborn root tests
        run: scripts/ci/run-reborn-root-partition.sh

  heavy-integration-tests:
    name: Heavy Integration Tests
    needs: changes
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.has_reborn_tests == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_call' || needs.changes.outputs.has_runtime_heavy_risk == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-tests-heavy-integration
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Run thread scheduling integration tests
        run: |
          timeout --signal=INT --kill-after=30s 15m \
            cargo test --no-default-features --features postgres,libsql,integration -- --nocapture

  windows-build:
    name: Windows Build (${{ matrix.name }})
    needs: [changes, matrix-config]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_reborn_tests == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_call')
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.windows_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-tests-windows-${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check compilation
        run: cargo check --all --benches --tests --examples ${{ matrix.flags }}

  bench-compile:
    name: Benchmark Compilation
    needs: changes
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.has_reborn_tests == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_call') &&
      needs.changes.outputs.has_core_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-tests-bench
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Compile benchmarks
        run: cargo bench --all-features --no-run

  docker-build:
    name: Docker Build
    needs: changes
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.has_reborn_tests == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.include_docker))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Build Docker image
        run: docker build --target runtime -t brassclaw-test:ci .

  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    needs: changes
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.has_reborn_tests == 'true'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version-check skip labels
        id: skip_labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ inputs.ref || github.sha }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "labels=${PR_LABELS}" >> "$GITHUB_OUTPUT"
            echo "allow_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMPARE_JSON="$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}")"
          PR_NUMBERS="$(
            printf '%s' "$COMPARE_JSON" | jq -r '.commits[].sha' \
            | while read -r sha; do
                [ -n "$sha" ] || continue
                gh api "repos/${REPO}/commits/${sha}/pulls" \
                  -H "Accept: application/vnd.github+json" \
                  --jq '.[].number' 2>/dev/null || true
              done \
            | awk 'NF && !seen[$0]++'
          )"

          PR_COUNT="$(printf '%s\n' "$PR_NUMBERS" | awk 'NF' | wc -l | tr -d ' ')"
          if [ "${PR_COUNT}" != "1" ]; then
            echo "labels=" >> "$GITHUB_OUTPUT"
            echo "allow_skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS="$(
            printf '%s\n' "$PR_NUMBERS" \
            | while read -r pr; do
                [ -n "$pr" ] || continue
                gh api "repos/${REPO}/issues/${pr}" --jq '.labels[].name' 2>/dev/null || true
              done \
            | awk 'NF && !seen[$0]++'
          )"

          if [ -n "$LABELS" ]; then
            echo "labels=$(printf '%s\n' "$LABELS" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          else
            echo "labels=" >> "$GITHUB_OUTPUT"
          fi
          echo "allow_skip=true" >> "$GITHUB_OUTPUT"
      - name: Check version bumps for changed extensions
        env:
          PR_LABELS: ${{ steps.skip_labels.outputs.labels }}
          GITHUB_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'merge_group' && github.event.merge_group.base_ref || '' }}
          ALLOW_SKIP_VERSION_CHECK: ${{ steps.skip_labels.outputs.allow_skip }}
        run: ./scripts/check-version-bumps.sh

  replay-required:
    name: Replay Required
    needs: changes
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.has_reborn_tests == 'true' &&
      github.event_name != 'push' &&
      (github.event_name == 'workflow_call' || needs.changes.outputs.has_engine_replay_risk == 'true')
    uses: ./.github/workflows/replay-gate.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  reborn-tests:
    name: Tests (Reborn)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - package-matrix
      - matrix-config
      - crate-tests
      - root-reborn-parity-tests
      - heavy-integration-tests
      - windows-build
      - bench-compile
      - docker-build
      - version-check
      - replay-required
    steps:
      - name: Check Reborn test result
        run: |
          require_success() {
            name="$1"
            result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name failed: $result"
              exit 1
            fi
          }

          event="${{ github.event_name }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes failed: ${{ needs.changes.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.docs_only }}" == "true" ]]; then
            echo "Docs-only change detected — Reborn test roll-up passes fast"
            exit 0
          fi

          if [[ "${{ needs.changes.outputs.has_reborn_tests }}" != "true" ]]; then
            echo "No Reborn test scope detected — Reborn test roll-up passes fast"
            exit 0
          fi

          require_success "package-matrix" "${{ needs.package-matrix.result }}"
          require_success "crate-tests" "${{ needs.crate-tests.result }}"
          require_success "root-reborn-parity-tests" "${{ needs.root-reborn-parity-tests.result }}"

          if [[ "$event" == "push" || "$event" == "workflow_call" || "${{ needs.changes.outputs.has_runtime_heavy_risk }}" == "true" ]]; then
            require_success "heavy-integration-tests" "${{ needs.heavy-integration-tests.result }}"
          fi

          if [[ "$event" != "push" && ( "$event" == "workflow_call" || "${{ needs.changes.outputs.has_engine_replay_risk }}" == "true" ) ]]; then
            require_success "replay-required" "${{ needs.replay-required.result }}"
          fi

          if [[ "$event" == "push" || "$event" == "workflow_call" ]]; then
            require_success "windows-build" "${{ needs.windows-build.result }}"
          fi

          if [[ ( "$event" == "push" || "$event" == "workflow_call" ) && "${{ needs.changes.outputs.has_core_code }}" == "true" ]]; then
            require_success "bench-compile" "${{ needs.bench-compile.result }}"
          fi

          if [[ "$event" == "push" || ( "$event" == "workflow_call" && "${{ inputs.include_docker }}" == "true" ) ]]; then
            require_success "docker-build" "${{ needs.docker-build.result }}"
          fi

          if [[ "$event" == "pull_request" || "$event" == "merge_group" ]]; then
            require_success "version-check" "${{ needs.version-check.result }}"
          fi
