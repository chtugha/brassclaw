name: Replay Snapshot Gate

# Runs `cargo insta test --check` over the committed replay fixtures so any
# change to engine dispatch, agent loop, or tool execution has to come with
# an accepted snapshot diff. `reborn-tests.yml` calls this workflow directly
# through `workflow_call` when replay becomes part of the protected
# `Tests (Reborn)` roll-up.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-snapshots:
    name: Replay snapshot gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: replay-gate
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-insta and cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-insta,cargo-nextest

      - name: Run replay snapshot tests
        env:
          NEXTEST_PROFILE: ci
        run: |
          cargo insta test \
            --check \
            --test-runner nextest \
            --features "libsql,replay" \
            --test reborn_trace_core_builtin_tools_parity \
            --test reborn_recorded_trace_parity \
            --test reborn_trace_error_path_parity \
            --test reborn_trace_file_tools_parity \
            --test reborn_trace_coding_read_tools_parity \
            --test reborn_trace_first_party_tool_coverage

      - name: Report trace coverage
        run: ./scripts/trace-coverage.sh

      - name: Reject committed .snap.new files
        run: |
          if git ls-files 'tests/snapshots/*.snap.new' | grep .; then
            echo "Committed .snap.new files found — run 'cargo insta review' and commit the accepted .snap."
            exit 1
          fi
