name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: brassclaw-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: brassclaw-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: brassclaw-macos-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --bin brassclaw --target ${{ matrix.target }}

      - name: Compute checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          sha256sum target/${{ matrix.target }}/release/brassclaw \
            | awk '{print $1}' > target/${{ matrix.target }}/release/brassclaw.sha256

      - name: Compute checksum (macOS)
        if: runner.os == 'macOS'
        run: |
          shasum -a 256 target/${{ matrix.target }}/release/brassclaw \
            | awk '{print $1}' > target/${{ matrix.target }}/release/brassclaw.sha256

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/brassclaw      ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/brassclaw.sha256 ${{ matrix.artifact_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

