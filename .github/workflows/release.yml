name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: brassclaw-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: brassclaw-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: brassclaw-macos-amd64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --bin brassclaw --target ${{ matrix.target }}

      - name: Compute checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          sha256sum target/${{ matrix.target }}/release/brassclaw \
            | awk '{print $1}' > target/${{ matrix.target }}/release/brassclaw.sha256

      - name: Compute checksum (macOS)
        if: runner.os == 'macOS'
        run: |
          shasum -a 256 target/${{ matrix.target }}/release/brassclaw \
            | awk '{print $1}' > target/${{ matrix.target }}/release/brassclaw.sha256

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/brassclaw      ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/brassclaw.sha256 ${{ matrix.artifact_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
          # Upload assets one at a time instead of concurrently. Parallel
          # uploads (the action's default via Promise.all) intermittently
          # trip GitHub's asset-upload backend with "Error creating asset
          # temp dir" when multiple large binaries land at once.
          preserve_order: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Made with Bob
