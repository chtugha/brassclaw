# Labels for actions/labeler@v6
# Maps file path globs to labels. Multiple labels can apply per PR.
#
# Updated for the post-Phase-6 crate structure. The v1 src/ tree was
# removed; all code now lives under crates/.

"scope: agent":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_agent_loop/**
          - crates/brassclaw_loop_support/**
          - crates/brassclaw_turns/**
          - crates/brassclaw_threads/**

"scope: tool":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_host_runtime/**
          - crates/brassclaw_capabilities/**

"scope: db":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_pg/**
          - crates/brassclaw_reborn_event_store/**
          - crates/brassclaw_embedded_postgres/**

"scope: db/postgres":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_pg/**
          - migrations/**

"scope: safety":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_safety/**

"scope: llm":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_llm/**

"scope: workspace":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_memory/**
          - crates/brassclaw_filesystem/**

"scope: secrets":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_secrets/**

"scope: config":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_reborn_config/**

"scope: extensions":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_extensions/**

"scope: sandbox":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_process_sandbox/**
          - Dockerfile*

"scope: hooks":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_hooks/**
          - crates/brassclaw_hooks_pg/**

"scope: composition":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_reborn_composition/**
          - crates/brassclaw_reborn/**

"scope: cli":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_reborn_cli/**

"scope: webui":
  - changed-files:
      - any-glob-to-any-file:
          - crates/brassclaw_webui_v2/**
          - crates/brassclaw_webui_v2_static/**
          - crates/brassclaw_reborn_webui_ingress/**

"scope: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/scripts/**

"scope: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
          - LICENSE*

"scope: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock

"DB MIGRATION":
  - changed-files:
      - any-glob-to-any-file:
          - migrations/**
          - crates/brassclaw_reborn_composition/src/migration.rs
