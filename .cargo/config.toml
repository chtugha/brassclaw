# ── Faster linker (macOS arm64) ───────────────────────────────────────────────
# Drive ld64.lld through Apple's own clang wrapper (/usr/bin/clang).
#
# Why not Homebrew clang as the driver?
#   Homebrew clang (LLVM 22) loads a cfg file that probes the CommandLineTools
#   SDK before handing off to the linker, adding ~35 ms of overhead *per
#   crate link*.  Apple clang resolves the same SDK in ~2 ms and drives
#   ld64.lld identically — `-fuse-ld` is a pass-through flag the driver never
#   interprets itself.  On a workspace with hundreds of linked artefacts the
#   difference is measurable (tens of seconds on a cold incremental build).
#
# mold does NOT support macOS; ld64.lld is the correct macOS alternative.
[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=/opt/homebrew/bin/ld64.lld",
]

# ── Cross-compilation target ──────────────────────────────────────────────────
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
ar = "x86_64-linux-musl-ar"

# ── Sparse registry protocol ──────────────────────────────────────────────────
# Replaces the legacy git-based index with an HTTP sparse fetch.
# Dramatically speeds up `cargo update` and first-time dependency resolution.
[registries.crates-io]
protocol = "sparse"

# ── Profile tweaks (dev only) ─────────────────────────────────────────────────
# `split-debuginfo = "unpacked"` keeps .dSYM unpacked during incremental
# builds, which lets the linker skip re-linking unchanged debug sections.
# `incremental = true` is the default for dev but explicit here for clarity.
[profile.dev]
split-debuginfo = "unpacked"
incremental = true
debug = 1

# Slightly faster incremental test builds; full optimisation for release stays
# at the cargo default (opt-level = 3).
[profile.test]
split-debuginfo = "unpacked"
incremental = true
debug = 1
