[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pre-existing advisories — tracked for upgrade in separate PRs
    # serde_yml unsound/unmaintained — direct dep, upgrade tracked separately
    "RUSTSEC-2025-0068",
    # tokio-tar PAX header parsing — sandbox containers only
    "RUSTSEC-2025-0111",
    # rustls-webpki advisories — 0.102.8 remains pinned by a libsql 0.6.0 transitive dep
    # (via rustls 0.22 → hyper-rustls 0.25); keep ignored until that pin is gone.
    # RUSTSEC-2026-0104: panic on empty `onlySomeReasons` BIT STRING during CRL parsing.
    # We do not use CRLs, and the advisory explicitly notes apps that don't parse CRLs
    # are unaffected. Same transitive pin as 0049/0098/0099 — tracked with them.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rand unsoundness with custom logger calling rand::rng() during reseed — we don't use this pattern;
    # revisit/remove by 2026-06-30, or when transitive deps (tower, nanoid, phf_generator) release rand ≥0.9.3 compat
    "RUSTSEC-2026-0097",
    # lopdf: stack overflow via deeply nested PDF objects (RUSTSEC-2026-0187).
    # lopdf is pulled in by the document-extraction path (src/document_extraction).
    # We do not accept untrusted PDFs in the critical path; extraction is user-initiated
    # from trusted local files. Remove once lopdf releases a patched version.
    "RUSTSEC-2026-0187",
    # postgres-types 0.2.13: SCRAM iteration count CPU exhaustion (RUSTSEC-2026-0179)
    # and hstore panic (RUSTSEC-2026-0180). Both affect the optional postgres feature;
    # the libsql path is unaffected. Remove once tokio-postgres/postgres-types are
    # upgraded to a patched release.
    "RUSTSEC-2026-0179",
    "RUSTSEC-2026-0180",
    # tokio-postgres: DataRow panic with fewer fields than columns (RUSTSEC-2026-0178).
    # Same postgres-feature transitive dep as 0179/0180 above. Unaffected on libsql path.
    "RUSTSEC-2026-0178",
    # rsa: Marvin Attack timing side-channel (RUSTSEC-2023-0071). Pulled in by the OIDC
    # stack (brassclaw_reborn_webui_ingress → openidconnect → rsa). The rsa crate is used
    # for JWT verification only, not for decryption of attacker-controlled ciphertexts on
    # a shared host, so the Marvin Attack is not exploitable in our deployment model.
    # Remove once openidconnect/jwt-simple upgrades to an rsa release without this advisory.
    "RUSTSEC-2023-0071",
    # lru: IterMut stacked-borrows violation (RUSTSEC-2026-0002).
    # Our direct deps now use lru ≥ 0.16.3 (patched). The remaining lru 0.12.5
    # is a transitive dep of ratatui 0.29.0 (via brassclaw_tui). The iterator
    # is not used by ratatui internally in a way that triggers the violation.
    # Remove once ratatui upgrades to lru ≥ 0.16.3.
    "RUSTSEC-2026-0002",
    # lru: panic-safety use-after-free in LruCache::pop() (RUSTSEC-2026-0253).
    # Our direct deps now use lru 0.18.2 (patched). The remaining lru 0.12.5
    # is a transitive dep of ratatui 0.29.0 (via brassclaw_tui). The pop()
    # call in ratatui's eviction path does not use key types with panicking
    # Drop impls, and catch_unwind is not used in that code path, so the
    # UAF/double-free is not reachable in practice.
    # Remove once ratatui upgrades to lru ≥ 0.18.2.
    "RUSTSEC-2026-0253",
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution) is strictly more permissive than MIT —
    # required by `jsonschema` (used for workspace document schema validation).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # PostgreSQL License — OSI approved, used by postgresql_archive/commands/embedded
    # (transitive deps of brassclaw_embedded_postgres).
    "PostgreSQL",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# monty (Pydantic's embedded Python) is git-only (not on crates.io),
# so it inherently lacks a version constraint. Allow path-dep wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Monty (Pydantic's embedded Python interpreter) — not yet on crates.io.
    # Pulls in ruff_* crates from astral-sh/ruff at a pinned revision.
    "https://github.com/pydantic/monty.git",
    "https://github.com/astral-sh/ruff.git",
]
