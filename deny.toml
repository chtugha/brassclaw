[advisories]
unmaintained = "workspace"
yanked = "deny"
# All known advisories are checked; dependency repairs must not add waivers.
ignore = []

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution) is strictly more permissive than MIT —
    # required by `jsonschema` (used for workspace document schema validation).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # minicbor / minicbor-serde: permissive copyright and patent grant;
    # redistribution must retain the license text or its canonical link.
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # PostgreSQL License — OSI approved, used by postgresql_archive/commands/embedded
    # (transitive deps of brassclaw_embedded_postgres).
    "PostgreSQL",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# monty (Pydantic's embedded Python) is git-only (not on crates.io),
# so it inherently lacks a version constraint. Allow path-dep wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The product uses reviewed vendored Monty and registry Ruff sources. The
# separate upstream-version comparison harness is not the product graph.
allow-git = []
