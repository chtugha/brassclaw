[package]
name = "brassclaw_monty_control_tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
tracing = "0.1"
brassclaw_monty_host = { path = "../../crates/brassclaw_monty_host" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "fs", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tempfile = "3"
async-trait = "0.1"
chrono = "0.4"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
thiserror = "2"
brassclaw_reborn = { path = "../../crates/brassclaw_reborn" }
brassclaw_threads = { path = "../../crates/brassclaw_threads" }
brassclaw_turns = { path = "../../crates/brassclaw_turns" }
brassclaw_loop_support = { path = "../../crates/brassclaw_loop_support" }
brassclaw_host_api = { path = "../../crates/brassclaw_host_api" }
brassclaw_pg = { path = "../../crates/brassclaw_pg" }
brassclaw_embedded_postgres = { path = "../../crates/brassclaw_embedded_postgres" }
brassclaw_interceptor = { path = "../../crates/brassclaw_interceptor" }
brassclaw_resources = { path = "../../crates/brassclaw_resources" }
brassclaw_skills = { path = "../../crates/brassclaw_skills", features = ["db-store"] }
brassclaw_authorization = { path = "../../crates/brassclaw_authorization" }
brassclaw_extensions = { path = "../../crates/brassclaw_extensions" }
brassclaw_filesystem = { path = "../../crates/brassclaw_filesystem", features = ["postgres"] }
brassclaw_host_runtime = { path = "../../crates/brassclaw_host_runtime" }
brassclaw_engine = { path = "../../crates/brassclaw_engine", features = ["skills-db"] }
brassclaw_processes = { path = "../../crates/brassclaw_processes" }
brassclaw_triggers = { path = "../../crates/brassclaw_triggers" }
brassclaw_trust = { path = "../../crates/brassclaw_trust" }
monty = { path = "../../vendor/monty-control/crates/monty" }
monty-types = { path = "../../vendor/monty-control/crates/monty-types" }
monty-alloc = { path = "../../vendor/monty-control/crates/monty-alloc", features = ["exit-code"] }

[lints.rust]
unsafe_code = "forbid"

# Reuse the existing actual-interpreter contract cases against the extension;
# the upstream upgrade workspace remains independently pinned to the tag.
[lib]
name = "brassclaw_monty_v1_upgrade_tests"
path = "../monty_v1_upgrade/src/lib.rs"

[[test]]
name = "compatibility"
path = "../monty_v1_upgrade/tests/compatibility.rs"

[[test]]
name = "global_lifecycle"
path = "../monty_v1_upgrade/tests/global_lifecycle.rs"

[[test]]
name = "recipe_failure_contract"
path = "../monty_v1_upgrade/tests/recipe_failure_contract.rs"

[[test]]
name = "recipe_state"
path = "../monty_v1_upgrade/tests/recipe_state.rs"

[[test]]
name = "task_accounting"
path = "../monty_v1_upgrade/tests/task_accounting.rs"
