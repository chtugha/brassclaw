[package]
name = "brassclaw_skills"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Skill component types, validation, and DB-backed storage for BrassClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"

[package.metadata.dist]
dist = false

[lints]
workspace = true

[features]
default = []
# DB-backed skill store backed by brassclaw_pg.
db-store = ["dep:brassclaw_pg", "dep:tokio-postgres"]
# v1 SKILL.md filesystem types: SkillManifest, LoadedSkill, SkillSource,
# ActivationCriteria, GatingRequirements, SkillCredentialSpec, SkillOAuthConfig,
# SkillCredentialLocation, ProviderRefreshStrategy, MAX_PROMPT_FILE_SIZE.
# Also gates component_type (ComponentType/ComponentTypeSet), which was the
# v2-era role-intersection dispatch model superseded by consumer_tags in v3.
# Enable only for the v1→v3 migration importer and SKILL.md parsing paths.
v1-types = []
# v2 MemoryDoc skill metadata types: V2SkillMetadata, CodeSnippet,
# SkillRevision, SkillRepairRecord, V2SkillSource, SkillMetrics.
# These are bridge types for the MemoryDoc-backed v2 engine path.
# Implies v1-types because V2SkillMetadata embeds ActivationCriteria /
# GatingRequirements from types.rs.
# Enable only for brassclaw_engine's skill_tracker (MemoryDoc fallback).
v2-compat = ["v1-types"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Optional (db-store feature)
brassclaw_pg = { path = "../brassclaw_pg", version = "0.1.0", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
