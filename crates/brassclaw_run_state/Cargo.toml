[package]
name = "brassclaw_run_state"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
libsql = ["dep:libsql"]
postgres = []

[dependencies]
async-trait = "0.1"
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_pg = { path = "../brassclaw_pg" }
deadpool-postgres = "0.14"
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
