[package]
name = "brassclaw_triggers"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Scheduled trigger domain and source-provider contracts for BrassClaw Reborn"
publish = false

[features]
default = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"
hex = "0.4"
deadpool-postgres = "0.14"
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_turns = { path = "../brassclaw_turns" }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
brassclaw_pg = { path = "../brassclaw_pg" }
serde_json = "1"
tempfile = "3"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt"] }
