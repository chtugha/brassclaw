[package]
name = "brassclaw_reborn_cli"
version = "0.41.2"
edition = "2024"
rust-version = "1.92"
description = "Standalone BrassClaw Reborn binary"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

# Keep disabled until #3483 resolves cargo-dist tag/versioning + Windows WiX
# packaging for the standalone Reborn binary.
[package.metadata.dist]
dist = false

[features]
default = ["root-llm-provider", "libsql"]
# Wire a real LLM provider into the assembled runtime. Mirrors the same
# `root-llm-provider` feature on `brassclaw_reborn_composition` /
# `brassclaw_reborn`, so building without it produces a CLI binary that
# can still boot the runtime substrate but will surface an "LLM gateway
# not wired" error on the first `send_user_message`.
root-llm-provider = [
    "brassclaw_reborn_composition/root-llm-provider",
]
# Compile in the Slack Events API host-beta mount for `brassclaw serve`.
# Still requires `[slack].enabled = true` at runtime before the route is
# mounted; ambient Slack env vars alone do not enable it.
slack-v2-host-beta = [
    "brassclaw_reborn_composition/slack-v2-host-beta",
]
# Enable libSQL database support for local-dev storage, including the
# safety configuration store and other local-dev features.
libsql = [
    "brassclaw_reborn_composition/libsql",
]
[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.5.0"
dotenvy = "0.15"
brassclaw_reborn_composition = { path = "../brassclaw_reborn_composition", version = "0.1.0" }
brassclaw_reborn_config = { path = "../brassclaw_reborn_config", version = "0.1.0" }
brassclaw_reborn_traces = { path = "../brassclaw_reborn_traces", version = "0.1.0" }
brassclaw_reborn_webui_ingress = { path = "../brassclaw_reborn_webui_ingress", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "io-std", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
# Enable the composition crate's `test-support` seam for CLI unit tests so
# `open_reborn_identity_resolver` (the test-only standalone resolver opener)
# is available when building this crate's tests. Production code uses the
# runtime-owned `RebornRuntime::open_reborn_identity_resolver` accessor
# instead. Feature-unifies with the `[dependencies]` entry above.
brassclaw_reborn_composition = { path = "../brassclaw_reborn_composition", version = "0.1.0", features = ["test-support"] }

[lib]
name = "brassclaw_reborn_cli"
path = "src/lib.rs"

[[bin]]
name = "brassclaw-reborn"
path = "src/main.rs"
