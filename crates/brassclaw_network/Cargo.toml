[package]
name = "brassclaw_network"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
lru = { version = "0.18", default-features = false }
brassclaw_host_api = { path = "../brassclaw_host_api" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
url = "2"
zeroize = "1"

[dev-dependencies]
h2 = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util"] }
