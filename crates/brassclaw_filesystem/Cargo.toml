[package]
name = "brassclaw_filesystem"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Scoped filesystem service for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
libsql = ["dep:libsql"]

[dependencies]
async-trait = "0.1"
blake3 = "1"
deadpool-postgres = { version = "0.14", optional = true }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_safety = { path = "../brassclaw_safety", version = "0.2.2" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
uuid = { version = "1", features = ["v4"] }
