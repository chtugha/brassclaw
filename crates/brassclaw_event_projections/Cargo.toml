[package]
name = "brassclaw_event_projections"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
brassclaw_events = { path = "../brassclaw_events" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_memory = { path = "../brassclaw_memory" }
brassclaw_turns = { path = "../brassclaw_turns" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
brassclaw_extensions = { path = "../brassclaw_extensions" }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_memory = { path = "../brassclaw_memory" }
brassclaw_reborn_event_store = { path = "../brassclaw_reborn_event_store" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
