[package]
name = "brassclaw_authorization"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []

[dependencies]
async-trait = "0.1"
brassclaw_pg = { path = "../brassclaw_pg" }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_trust = { path = "../brassclaw_trust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
