[package]
name = "brassclaw_embeddings"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Embedding-provider trait, LRU caching decorator, and URL check utilities (S10 refactor — concrete impls moved to brassclaw_reborn_composition)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[package.metadata.dist]
dist = false

[features]
default = []
# Exposes `MockEmbeddings` for downstream test harnesses. Off in release
# builds so the deterministic-hash mock can't be reached from production
# code paths.
testing = []

[dependencies]
async-trait = "0.1"
lru = "0.18.2"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
