[package]
name = "brassclaw_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Unified thread-capability-CodeAct execution engine for BrassClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[package.metadata.dist]
dist = false

[lints]
workspace = true

[features]
# Load skills from reborn_skills DB table instead of MemoryDoc filesystem.
# Load tools from reborn_tools DB table into the ToolRegistry capability surface.
# Both require a live brassclaw_pg pool to be threaded in.
skills-db = ["brassclaw_skills/db-store", "dep:brassclaw_pg", "dep:brassclaw_capabilities", "dep:tokio-postgres"]
# skill_tracker.rs uses V2SkillMetadata / SkillRevision / V2SkillSource for
# the MemoryDoc-backed v2 skill telemetry path (legacy bridge — do not expand).
v2-skill-tracker = ["brassclaw_skills/v2-compat"]

[dependencies]
brassclaw_monty_host = { path = "../brassclaw_monty_host" }
async-trait = "0.1"
cron = "0.13"
brassclaw_capabilities = { path = "../brassclaw_capabilities", optional = true }
brassclaw_common = { path = "../brassclaw_common", version = "0.4.2" }
brassclaw_skills = { path = "../brassclaw_skills", version = "0.3.0", default-features = false, features = ["v2-compat"] }
brassclaw_pg = { path = "../brassclaw_pg", version = "0.1.0", optional = true }
tokio-postgres = { version = "0.7", optional = true }
chrono = { version = "0.4", features = ["serde"] }
# Verified v1.0.0 plus the versioned control extension; both application
# consumers share exactly these sources. See vendor/monty-control/BRASSCLAW.md.
monty = { path = "../../vendor/monty-control/crates/monty" }
monty-types = { path = "../../vendor/monty-control/crates/monty-types" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"

[dev-dependencies]
brassclaw_embedded_postgres = { path = "../brassclaw_embedded_postgres" }
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
