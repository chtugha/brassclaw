[package]
name = "brassclaw_resources"
version = "0.1.0"
edition = "2024"
# Keep in sync with the workspace-level package.rust-version.
rust-version = "1.92"
description = "Resource reservation governor for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
libsql = ["dep:libsql"]
postgres = []

[dependencies]
brassclaw_pg = { path = "../brassclaw_pg" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
deadpool-postgres = "0.14"
fs2 = "0.4"
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rust_decimal_macros = "1"
tempfile = "3"
