[package]
name = "brassclaw_pg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared PostgreSQL pool management, migration runner, and schema for brassclaw."
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"

[lints]
workspace = true

[dependencies]
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
refinery = { version = "0.8", features = ["tokio-postgres"] }
pgvector = { version = "0.4", features = ["postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = { version = "2", optional = true }

[features]
# Heavy integration tests that require a live Postgres; run with:
#   cargo test -p brassclaw_pg --features integration
integration = []
# Actual plaintext/TLS servers, dedicated LISTEN sessions and certificate checks.
# TEST_PG_URL, TEST_PG_REMOTE_URL, TEST_PG_TLS_URL, TEST_PG_UNTRUSTED_URL
# and a trust store containing only the acceptance CA are required.
connection-integration = []
# Real loopback PostgreSQL wire fault injection for downstream native tests.
# Not enabled by ordinary application dependencies.
test-support = ["dep:tokio-util", "dep:url", "tokio/net", "tokio/io-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }
