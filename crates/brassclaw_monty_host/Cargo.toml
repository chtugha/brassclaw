[package]
name = "brassclaw_monty_host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated Monty 1.0 task program hosting for the global orchestrator cutover"

# The worker is packaged separately; its allocator never enters the product.

[dependencies]
futures = "0.3"
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_resources = { path = "../brassclaw_resources" }
monty = { path = "../../vendor/monty-control/crates/monty" }
monty-types = { path = "../../vendor/monty-control/crates/monty-types" }
sha2 = "0.10"
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
num-traits = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "process", "time", "rt", "sync", "macros"] }
monty-alloc = { path = "../../vendor/monty-control/crates/monty-alloc", features = ["exit-code"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

# The owning transport/service package runs the same actual-worker acceptance
# cases as the composition integration workspace, without depending on Engine.
[dev-dependencies]
tempfile = "3"

[[test]]
name = "actor_host"
path = "../../tests/monty_control/tests/actor_host.rs"

[[test]]
name = "service_host"
path = "../../tests/monty_control/tests/service_host.rs"
