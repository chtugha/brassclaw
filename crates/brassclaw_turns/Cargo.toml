[package]
name = "brassclaw_turns"
version = "0.1.0"
edition = "2024"
# Keep in sync with the workspace-level package.rust-version.
rust-version = "1.92"
description = "Host-layer turn coordination contracts for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []

[dependencies]
async-trait = "0.1"
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_pg = { path = "../brassclaw_pg" }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
heck = "0.5"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
