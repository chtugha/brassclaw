    <script nonce="__BRASSCLAW_CSP_NONCE__">
      (() => {
        try {
          const stored = localStorage.getItem("brassclaw:v2-theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          window.__BRASSCLAW_INITIAL_THEME__ = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
          window.__BRASSCLAW_INITIAL_THEME__ = "light";
        }
      })();
    </script>
