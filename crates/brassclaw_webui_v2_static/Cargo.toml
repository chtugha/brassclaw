[package]
name = "brassclaw_webui_v2_static"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Static asset bundle for the Reborn WebChat v2 SPA. Host composition mounts the resulting Router alongside the JSON ingress."
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[dependencies]
# Tiny RNG for per-request CSP nonces. `default-features = false`
# keeps the dep surface minimal — only the `std` + `std_rng` features
# are pulled in (no `rand` derive macros, no SmallRng grab-bag).
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
axum = "0.8"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
