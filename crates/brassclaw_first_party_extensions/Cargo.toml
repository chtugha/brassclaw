[package]
name = "brassclaw_first_party_extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "First-party userland extension implementations for BrassClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
blake3 = "1"
futures-util = "0.3"
glob = "0.3"
brassclaw_auth = { path = "../brassclaw_auth" }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_safety = { path = "../brassclaw_safety" }
brassclaw_skills = { path = "../brassclaw_skills" }
regex = "1"
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
