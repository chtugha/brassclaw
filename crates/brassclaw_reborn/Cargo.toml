[package]
name = "brassclaw_reborn"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Standalone Reborn composition and adapters for BrassClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
root-llm-provider = ["dep:brassclaw_llm"]
libsql-secrets = [
    "dep:brassclaw_secrets",
    "dep:libsql",
    "dep:secrecy",
    "dep:brassclaw_filesystem",
    "brassclaw_filesystem/libsql",
    "filesystem-goal-store",
]
filesystem-goal-store = ["dep:brassclaw_filesystem"]
# Local-dev trigger-fire access store (libSQL-backed). Named for its original
# WebChat user-store home; the canonical user store has since moved to the
# filesystem identity resolver, so this feature now only gates the
# `local_trigger_access` module.
webui-user-store = ["dep:libsql"]
# Opt-in because the restart coverage opens real libSQL-backed turn/thread stores.
# Keep separate from `libsql-secrets` so local `cargo test -p brassclaw_reborn`
# stays fast, while CI can exercise process-restart persistence explicitly.
libsql-restart-tests = [
    "dep:libsql",
    "dep:brassclaw_filesystem",
    "brassclaw_filesystem/libsql",
    "filesystem-goal-store",
]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false }
brassclaw_agent_loop = { path = "../brassclaw_agent_loop", version = "0.1.0" }
brassclaw_events = { path = "../brassclaw_events", version = "0.1.0" }
brassclaw_hooks = { path = "../brassclaw_hooks", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_host_runtime = { path = "../brassclaw_host_runtime", version = "0.1.0" }
brassclaw_llm = { path = "../brassclaw_llm", version = "0.1.0", optional = true, default-features = false }
brassclaw_loop_support = { path = "../brassclaw_loop_support", version = "0.1.0" }
brassclaw_secrets = { path = "../brassclaw_secrets", version = "0.1.0", optional = true }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0", optional = true }
brassclaw_threads = { path = "../brassclaw_threads", version = "0.1.0" }
brassclaw_turns = { path = "../brassclaw_turns", version = "0.1.0" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
parking_lot = "0.12"
secrecy = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
brassclaw_agent_loop = { path = "../brassclaw_agent_loop", version = "0.1.0", features = ["test-support"] }
brassclaw_authorization = { path = "../brassclaw_authorization", version = "0.1.0" }
brassclaw_event_projections = { path = "../brassclaw_event_projections", version = "0.1.0" }
brassclaw_extensions = { path = "../brassclaw_extensions", version = "0.1.0" }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_processes = { path = "../brassclaw_processes", version = "0.1.0" }
brassclaw_reborn_event_store = { path = "../brassclaw_reborn_event_store", version = "0.1.0" }
brassclaw_resources = { path = "../brassclaw_resources", version = "0.1.0" }
brassclaw_scripts = { path = "../brassclaw_scripts", version = "0.1.0" }
brassclaw_skills = { path = "../brassclaw_skills", version = "0.3.0", default-features = false }
brassclaw_trust = { path = "../brassclaw_trust", version = "0.1.0" }
rust_decimal = "1"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wat = "1.245.1"
tracing-test = "0.2"

[[test]]
name = "llm_gateway"
required-features = ["root-llm-provider"]

[lints]
workspace = true
