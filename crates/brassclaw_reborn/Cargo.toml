[package]
name = "brassclaw_reborn"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Standalone Reborn composition and adapters for BrassClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
root-llm-provider = ["dep:brassclaw_llm"]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false }
brassclaw_agent_loop = { path = "../brassclaw_agent_loop", version = "0.1.0" }
brassclaw_events = { path = "../brassclaw_events", version = "0.1.0" }
brassclaw_interceptor = { path = "../brassclaw_interceptor", version = "0.1.0" }
brassclaw_hooks = { path = "../brassclaw_hooks", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_host_runtime = { path = "../brassclaw_host_runtime", version = "0.1.0" }
brassclaw_llm = { path = "../brassclaw_llm", version = "0.1.0", optional = true, default-features = false }
brassclaw_loop_support = { path = "../brassclaw_loop_support", version = "0.1.0" }
brassclaw_threads = { path = "../brassclaw_threads", version = "0.1.0" }
brassclaw_turns = { path = "../brassclaw_turns", version = "0.1.0" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
brassclaw_agent_loop = { path = "../brassclaw_agent_loop", version = "0.1.0", features = ["test-support"] }
brassclaw_authorization = { path = "../brassclaw_authorization", version = "0.1.0" }
brassclaw_event_projections = { path = "../brassclaw_event_projections", version = "0.1.0" }
brassclaw_extensions = { path = "../brassclaw_extensions", version = "0.1.0" }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_processes = { path = "../brassclaw_processes", version = "0.1.0" }
brassclaw_reborn_event_store = { path = "../brassclaw_reborn_event_store", version = "0.1.0" }
brassclaw_resources = { path = "../brassclaw_resources", version = "0.1.0" }
brassclaw_skills = { path = "../brassclaw_skills", version = "0.3.0", default-features = false }
brassclaw_trust = { path = "../brassclaw_trust", version = "0.1.0" }
rust_decimal = "1"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wat = "1.245.1"
tracing-test = "0.2"

[[test]]
name = "llm_gateway"
required-features = ["root-llm-provider"]

[lints]
workspace = true
