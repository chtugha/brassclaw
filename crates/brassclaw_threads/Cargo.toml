[package]
name = "brassclaw_threads"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Canonical session thread and transcript service contracts for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
postgres = []

[dependencies]
async-trait = "0.1"
brassclaw_pg = { path = "../brassclaw_pg" }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
futures = "0.3"
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_safety = { path = "../brassclaw_safety", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
