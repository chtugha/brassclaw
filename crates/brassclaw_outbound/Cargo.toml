[package]
name = "brassclaw_outbound"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Outbound egress and projection subscription policy storage for BrassClaw Reborn"
publish = false

[features]
default = []
libsql = ["dep:libsql"]
# postgres feature kept for compatibility but deps are now unconditional
postgres = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
hex = "0.4"
brassclaw_event_projections = { path = "../brassclaw_event_projections" }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_turns = { path = "../brassclaw_turns" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio-postgres = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
brassclaw_events = { path = "../brassclaw_events" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
