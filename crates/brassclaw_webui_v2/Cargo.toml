[package]
name = "brassclaw_webui_v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Reborn WebChat v2 HTTP route surface."
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
# Deliberately no direct dependency on `brassclaw_product_adapters`. Handlers
# must consume only the `RebornServicesApi` facade plus the ingress + error
# vocabulary; projection types (`ProjectionCursor`, `ProductOutboundEnvelope`)
# are re-exported through `brassclaw_product_workflow`. The architecture
# boundary test in `brassclaw_architecture` enforces this edge.
brassclaw_product_workflow = { path = "../brassclaw_product_workflow", version = "0.1.0" }

async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
brassclaw_product_workflow = { path = "../brassclaw_product_workflow", features = ["test-support"] }
# Production handlers must NOT depend on `brassclaw_product_adapters`
# (enforced by the architecture boundary test). The handler contract
# tests do, because they need to construct `ProductOutboundEnvelope`
# fixtures with the canonical newtype constructors to drive the SSE
# projection wire-shape regression.
brassclaw_product_adapters = { path = "../brassclaw_product_adapters" }
brassclaw_threads = { path = "../brassclaw_threads" }
brassclaw_turns = { path = "../brassclaw_turns" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
# Real WebSocket client for the stream_events_ws frame-content test.
# Oneshot can't complete a true WS upgrade so the frame-flow test
# needs a bound listener + proper handshake.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
