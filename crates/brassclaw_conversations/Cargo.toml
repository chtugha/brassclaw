[package]
name = "brassclaw_conversations"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Conversation binding and session thread contracts for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_safety = { path = "../brassclaw_safety" }
brassclaw_triggers = { path = "../brassclaw_triggers", version = "0.1.0" }
brassclaw_turns = { path = "../brassclaw_turns", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-postgres = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
