[package]
name = "brassclaw_product_workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Product-facing workflow facade for BrassClaw Reborn (#3280)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
# Compile in-memory fakes (FakeInboundTurnService, FakeConversationBindingService,
# FakeIdempotencyLedger, etc.). Off by default so production binaries don't carry
# the fake state machinery; downstream crates enable it from `[dev-dependencies]`.
test-support = ["brassclaw_product_adapters/test-support"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
brassclaw_common = { path = "../brassclaw_common", version = "0.4.1" }
brassclaw_approvals = { path = "../brassclaw_approvals", version = "0.1.0" }
brassclaw_authorization = { path = "../brassclaw_authorization", version = "0.1.0" }
brassclaw_auth = { path = "../brassclaw_auth", version = "0.1.0" }
brassclaw_events = { path = "../brassclaw_events", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_conversations = { path = "../brassclaw_conversations", version = "0.1.0" }
brassclaw_llm = { path = "../brassclaw_llm", version = "0.1.0" }
brassclaw_outbound = { path = "../brassclaw_outbound", version = "0.1.0" }
brassclaw_product_adapters = { path = "../brassclaw_product_adapters", version = "0.1.0" }
brassclaw_run_state = { path = "../brassclaw_run_state", version = "0.1.0" }
brassclaw_threads = { path = "../brassclaw_threads", version = "0.1.0" }
brassclaw_turns = { path = "../brassclaw_turns", version = "0.1.0" }
brassclaw_pg = { path = "../brassclaw_pg" }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
brassclaw_host_runtime = { path = "../brassclaw_host_runtime" }
brassclaw_loop_support = { path = "../brassclaw_loop_support" }
brassclaw_event_projections = { path = "../brassclaw_event_projections" }
brassclaw_reborn_composition = { path = "../brassclaw_reborn_composition" }
brassclaw_reborn = { path = "../brassclaw_reborn" }
brassclaw_trust = { path = "../brassclaw_trust" }
brassclaw_product_workflow = { path = ".", features = ["test-support"] }
brassclaw_product_adapters = { path = "../brassclaw_product_adapters", features = ["test-support", "host-auth-mint"] }
brassclaw_telegram_v2_adapter = { path = "../brassclaw_telegram_v2_adapter" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
