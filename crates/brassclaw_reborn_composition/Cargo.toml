[package]
name = "brassclaw_reborn_composition"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Facade-shaped production composition root for BrassClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = ["libsql"]
# Wire a host-managed LLM model gateway into the assembled runtime via
# brassclaw_reborn's `LlmProviderModelGateway`. Off by default so this crate
# stays substrate-only when callers don't want a model gateway in the
# composed runtime. Mirrors `brassclaw_reborn`'s own `root-llm-provider`
# feature shape (optional dep, `default-features = false`).
root-llm-provider = [
    "dep:brassclaw_llm",
    "brassclaw_llm/registry-provider-factory",
    "brassclaw_reborn/root-llm-provider",
]
# Expose test-only helpers (mock LLM gateway, budget runtime accessors)
# so integration tests in this crate's `tests/` directory and downstream
# crates can drive `build_reborn_runtime` with a stub model gateway
# (via `RebornRuntimeInput::with_model_gateway_override`) and inspect the
# budget pipeline end-to-end. Enable with `cargo test --features
# test-support` (plus whatever feature surface the test crate also requires).
test-support = []
libsql = [
    "dep:libsql",
    "brassclaw_filesystem/libsql",
    "brassclaw_host_runtime/libsql",
    "brassclaw_reborn/filesystem-goal-store",
    "brassclaw_reborn/webui-user-store",
    "brassclaw_reborn_event_store/libsql",
    "brassclaw_resources/libsql",
    "brassclaw_run_state/libsql",
    "brassclaw_triggers/libsql",
]
postgres = [
    "brassclaw_filesystem/postgres",
    "brassclaw_host_runtime/postgres",
    "brassclaw_reborn/filesystem-goal-store",
    "brassclaw_reborn_event_store/postgres",
    "brassclaw_resources/postgres",
    "brassclaw_run_state/postgres",
    "brassclaw_triggers/postgres",
]
[dependencies]
brassclaw_pg = { path = "../brassclaw_pg" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
futures = "0.3"
brassclaw_auth = { path = "../brassclaw_auth" }
brassclaw_common = { path = "../brassclaw_common" }
brassclaw_capabilities = { path = "../brassclaw_capabilities" }
brassclaw_approvals = { path = "../brassclaw_approvals" }
brassclaw_authorization = { path = "../brassclaw_authorization" }
brassclaw_conversations = { path = "../brassclaw_conversations" }
brassclaw_event_projections = { path = "../brassclaw_event_projections" }
brassclaw_event_streams = { path = "../brassclaw_event_streams" }
brassclaw_events = { path = "../brassclaw_events" }
brassclaw_extensions = { path = "../brassclaw_extensions" }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_first_party_extensions = { path = "../brassclaw_first_party_extensions" }
brassclaw_engine = { path = "../brassclaw_engine" }
brassclaw_hooks = { path = "../brassclaw_hooks" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_agent_loop = { path = "../brassclaw_agent_loop" }
brassclaw_host_runtime = { path = "../brassclaw_host_runtime" }
brassclaw_llm = { path = "../brassclaw_llm", optional = true, default-features = false }
brassclaw_loop_support = { path = "../brassclaw_loop_support" }
brassclaw_mcp = { path = "../brassclaw_mcp" }
brassclaw_network = { path = "../brassclaw_network" }
brassclaw_outbound = { path = "../brassclaw_outbound" }
brassclaw_processes = { path = "../brassclaw_processes" }
brassclaw_product_adapters = { path = "../brassclaw_product_adapters" }
brassclaw_product_workflow = { path = "../brassclaw_product_workflow" }
brassclaw_reborn = { path = "../brassclaw_reborn" }
brassclaw_reborn_config = { path = "../brassclaw_reborn_config" }
brassclaw_reborn_identity = { path = "../brassclaw_reborn_identity" }
brassclaw_reborn_event_store = { path = "../brassclaw_reborn_event_store" }
brassclaw_first_party_extension_ports = { path = "../brassclaw_first_party_extension_ports" }
brassclaw_resources = { path = "../brassclaw_resources" }
brassclaw_run_state = { path = "../brassclaw_run_state" }
brassclaw_runtime_policy = { path = "../brassclaw_runtime_policy" }
brassclaw_safety = { path = "../brassclaw_safety" }
brassclaw_secrets = { path = "../brassclaw_secrets" }
brassclaw_skills = { path = "../brassclaw_skills" }
brassclaw_threads = { path = "../brassclaw_threads" }
brassclaw_triggers = { path = "../brassclaw_triggers" }
brassclaw_trust = { path = "../brassclaw_trust" }
brassclaw_turns = { path = "../brassclaw_turns" }
# WebUI v2 route surface — always included
brassclaw_webui_v2 = { path = "../brassclaw_webui_v2" }
# WebUI v2 static SPA bundle — mounted under `/v2`
brassclaw_webui_v2_static = { path = "../brassclaw_webui_v2_static" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
# axum + tower middleware stack used by the `webui_serve` module
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header", "limit", "catch-panic"] }
lru = "0.16"
fs4 = "0.6"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
async-trait = "0.1"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
brassclaw_common = { path = "../brassclaw_common" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_host_runtime = { path = "../brassclaw_host_runtime", features = ["test-support"] }
brassclaw_conversations = { path = "../brassclaw_conversations" }
brassclaw_reborn_composition = { path = ".", features = ["test-support"] }
brassclaw_threads = { path = "../brassclaw_threads" }
brassclaw_turns = { path = "../brassclaw_turns" }
brassclaw_product_workflow = { path = "../brassclaw_product_workflow", features = ["test-support"] }
brassclaw_product_adapters = { path = "../brassclaw_product_adapters" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"
sha2 = "0.10"
tempfile = "3"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
# Real WebSocket client for the v2 stream-events-ws caller-level test.
# Oneshot via `tower::ServiceExt::oneshot` cannot complete a true WS
# upgrade (no underlying TCP stream → axum's WebSocketUpgrade extractor
# returns 426), so the happy-path test needs a bound listener and a
# proper WS client.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = "0.2"

[build-dependencies]
brassclaw_skills = { path = "../brassclaw_skills" }
serde_json = "1"

[lints]
workspace = true
