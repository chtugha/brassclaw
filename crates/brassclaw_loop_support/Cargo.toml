[package]
name = "brassclaw_loop_support"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Loop support services for BrassClaw Reborn AgentLoopHost implementations"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[dependencies]
async-trait = "0.1"
brassclaw_pg = { path = "../brassclaw_pg" }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
deadpool-postgres = "0.14"
futures = "0.3"
hex = "0.4.3"
jsonschema = { version = "0.45", default-features = false }
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_host_runtime = { path = "../brassclaw_host_runtime", version = "0.1.0" }
brassclaw_process_sandbox = { path = "../brassclaw_process_sandbox", version = "0.1.0" }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_resources = { path = "../brassclaw_resources", version = "0.1.0" }
brassclaw_safety = { path = "../brassclaw_safety", version = "0.2.2" }
brassclaw_skills = { path = "../brassclaw_skills", version = "0.3.0", default-features = false }
brassclaw_memory = { path = "../brassclaw_memory", version = "0.1.0" }
brassclaw_threads = { path = "../brassclaw_threads", version = "0.1.0" }
brassclaw_turns = { path = "../brassclaw_turns", version = "0.1.0" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
brassclaw_trust = { path = "../brassclaw_trust", version = "0.1.0" }
rust_decimal_macros = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
