[package]
name = "brassclaw_product_workflow_storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Durable storage adapters for BrassClaw Reborn product workflow"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/chtugha/brassclaw"
repository = "https://github.com/chtugha/brassclaw"
publish = false

[features]
default = []
postgres = ["brassclaw_filesystem/postgres"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
brassclaw_filesystem = { path = "../brassclaw_filesystem", version = "0.1.0" }
brassclaw_host_api = { path = "../brassclaw_host_api", version = "0.1.0" }
brassclaw_product_workflow = { path = "../brassclaw_product_workflow", version = "0.1.0" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
deadpool-postgres = "0.14"
brassclaw_filesystem = { path = "../brassclaw_filesystem", features = ["postgres"] }
brassclaw_product_adapters = { path = "../brassclaw_product_adapters" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-postgres = "0.7"
