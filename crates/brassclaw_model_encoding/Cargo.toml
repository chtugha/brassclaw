[package]
name = "brassclaw_model_encoding"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hex = "0.4"
indexmap = "2"
minijinja = { version = "=3.0.1", default-features = false, features = ["brassclaw_eager_concat", "builtins", "macros", "multi_template", "adjacent_loop_items", "std_collections", "fuel", "preserve_order", "serde", "json", "loop_controls"] }
minijinja-contrib = { version = "=3.0.1", default-features = false, features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[lints]
workspace = true
