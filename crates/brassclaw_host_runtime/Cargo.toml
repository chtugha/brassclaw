[package]
name = "brassclaw_host_runtime"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
test-support = []
postgres = ["dep:deadpool-postgres", "brassclaw_filesystem/postgres", "brassclaw_resources/postgres", "brassclaw_run_state/postgres"]
libsql = ["dep:libsql", "brassclaw_filesystem/libsql", "brassclaw_resources/libsql", "brassclaw_run_state/libsql"]

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
bollard = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
deadpool-postgres = { version = "0.14", optional = true }
futures-util = "0.3"
dirs = "6"
hex = "0.4"
brassclaw_approvals = { path = "../brassclaw_approvals" }
brassclaw_authorization = { path = "../brassclaw_authorization" }
brassclaw_capabilities = { path = "../brassclaw_capabilities" }
brassclaw_process_sandbox = { path = "../brassclaw_process_sandbox" }
brassclaw_dispatcher = { path = "../brassclaw_dispatcher" }
brassclaw_events = { path = "../brassclaw_events" }
brassclaw_extensions = { path = "../brassclaw_extensions" }
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
brassclaw_first_party_extensions = { path = "../brassclaw_first_party_extensions" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_memory = { path = "../brassclaw_memory" }
brassclaw_mcp = { path = "../brassclaw_mcp" }
brassclaw_network = { path = "../brassclaw_network" }
brassclaw_processes = { path = "../brassclaw_processes" }
brassclaw_product_adapter_registry = { path = "../brassclaw_product_adapter_registry" }
brassclaw_prompt_envelope = { path = "../brassclaw_prompt_envelope" }
brassclaw_reborn_event_store = { path = "../brassclaw_reborn_event_store" }
brassclaw_resources = { path = "../brassclaw_resources" }
brassclaw_run_state = { path = "../brassclaw_run_state" }
brassclaw_runtime_policy = { path = "../brassclaw_runtime_policy" }
brassclaw_safety = { path = "../brassclaw_safety" }
brassclaw_scripts = { path = "../brassclaw_scripts" }
brassclaw_secrets = { path = "../brassclaw_secrets" }
brassclaw_skills = { path = "../brassclaw_skills" }
brassclaw_triggers = { path = "../brassclaw_triggers" }
brassclaw_trust = { path = "../brassclaw_trust" }
brassclaw_turns = { path = "../brassclaw_turns" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
jsonschema = { version = "0.45", default-features = false }
libc = "0.2"
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
brassclaw_event_projections = { path = "../brassclaw_event_projections" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-postgres = "0.7"
zeroize = "1"

[lints]
workspace = true
