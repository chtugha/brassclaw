[package]
name = "brassclaw_mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
brassclaw_extensions = { path = "../brassclaw_extensions" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_resources = { path = "../brassclaw_resources" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
