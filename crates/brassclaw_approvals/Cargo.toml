[package]
name = "brassclaw_approvals"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []

[dependencies]
async-trait = "0.1"
brassclaw_authorization = { path = "../brassclaw_authorization" }
brassclaw_events = { path = "../brassclaw_events" }
brassclaw_host_api = { path = "../brassclaw_host_api" }
brassclaw_pg = { path = "../brassclaw_pg" }
brassclaw_run_state = { path = "../brassclaw_run_state" }
deadpool-postgres = "0.14"
serde_json = "1"
thiserror = "2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }

[dev-dependencies]
async-trait = "0.1"
brassclaw_filesystem = { path = "../brassclaw_filesystem" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
