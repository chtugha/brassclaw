[package]
name = "tomedo-monitor"
version = "0.1.0"
edition = "2021"
description = "macOS background daemon that tracks the active Tomedo patient window and serves the current patient ID via a local HTTP endpoint"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "tomedo-monitor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"
core-foundation = "0.9"
core-foundation-sys = "0.8"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
